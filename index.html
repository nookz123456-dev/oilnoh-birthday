<!doctype html>
<html lang="th">
<meta charset="utf-8">
<title>OilNoh's Birthday Cake</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@1,300;1,400&family=Mali:wght@500;700&display=swap">
<style>
  :root{
    --bg1:#ffe1e8; --bg2:#ffc4d3; --ink:#b04a70; --soft:#7a4a55;
    --sponge:#ffe6bf; --jam:#ff8fab; --cream:#fffaf2; --plate:#ffffff;
  }
  html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation}
  body{background:radial-gradient(ellipse at 50% 30%,var(--bg1) 0,var(--bg2) 90%);color:var(--ink);
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
       padding-inline:16px;font-family:Mali,system-ui,sans-serif}

  /* ---------- หน้ากล่องของขวัญ ---------- */
  #gift{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
        background:radial-gradient(circle at 50% 45%,#fff0f4 0,var(--bg2) 75%);cursor:pointer;text-align:center;padding-inline:16px}
  #gift .box{font-size:84px;animation:wiggle 1.4s ease-in-out infinite}
  #gift b{font:700 22px/1.5 Mali,sans-serif}
  #gift small{font-size:15px;opacity:.7}
  @keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg) scale(1.05)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}

  /* ---------- ธงราว ---------- */
  #bunting{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;gap:3px;pointer-events:none;z-index:1}
  #bunting::before{content:"";position:absolute;top:6px;left:4%;right:4%;height:2px;background:rgba(176,74,112,.35)}
  .flag{width:clamp(20px,6vw,34px);height:clamp(28px,8vw,44px);clip-path:polygon(0 0,100% 0,50% 100%);
        display:flex;justify-content:center;padding-top:5px;box-sizing:border-box;
        font:700 clamp(11px,3vw,17px)/1 Mali,sans-serif;color:#fff;transform-origin:50% 0;
        translate:0 calc(var(--y) + 6px)}
  .flag.gap{visibility:hidden;width:clamp(8px,2vw,14px)}
  .go .flag{animation:swingIn 1.3s cubic-bezier(.3,1.5,.5,1) calc(.3s + var(--i) * .09s) both,
                     sway 3s ease-in-out calc(2.8s + var(--i) * .1s) infinite alternate}
  @keyframes swingIn{from{transform:translateY(-60px) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes sway{from{rotate:-4deg}to{rotate:4deg}}

  /* ---------- ลูกโป่ง ---------- */
  .balloon{position:fixed;bottom:-90px;width:36px;height:44px;border-radius:50% 50% 48% 48%;z-index:0;opacity:.85;
           box-shadow:inset -6px -8px 0 rgba(0,0,0,.06);pointer-events:none}
  .balloon::after{content:"";position:absolute;top:44px;left:50%;width:1px;height:46px;background:rgba(176,74,112,.35)}
  .go .balloon{animation:rise var(--t) linear var(--d) infinite}
  @keyframes rise{from{transform:translate(0,0)}50%{transform:translate(18px,-60vh)}to{transform:translate(-10px,-125vh)}}

  /* ---------- เค้ก: ทุกชิ้นใช้ keyframes drop เดียวกัน ต่างกันแค่ delay ---------- */
  .scene{position:relative;z-index:2;transform-origin:50% 100%}
  /* ตอนการ์ดขึ้น เลื่อนเค้ก+ข้อความขึ้นเท่าที่ทับกันจริง (--lift คำนวณใน JS) */
  .scene,.words{translate:0 calc(-1 * var(--lift, 0px));transition:translate 1.1s cubic-bezier(.3,1.2,.5,1)}
  @media (min-width:700px){.scene{transform:scale(1.3)}}
  .cake{position:relative;width:240px;height:200px;cursor:pointer;outline:none}
  .cake:focus-visible{outline:2px dashed var(--ink);outline-offset:8px;border-radius:12px}
  .cake > *{position:absolute;left:50%;translate:-50% 0}
  .go .cake > *{animation:drop 1s cubic-bezier(.3,1.4,.5,1) both}

  .plate {bottom:0;width:290px;height:9px;border-radius:5px;background:var(--plate);box-shadow:0 6px 14px rgba(176,74,112,.18)}
  .go .plate{animation-name:slide;animation-delay:.3s}
  .sponge{width:240px;height:30px;background:var(--sponge);border-radius:3px}
  .jam   {width:240px;height:8px;background:var(--jam)}
  .s1{bottom:9px} .j1{bottom:39px} .s2{bottom:47px} .j2{bottom:77px} .s3{bottom:85px}
  .go .s1{animation-delay:.9s} .go .j1{animation-delay:1.4s} .go .s2{animation-delay:1.8s}
  .go .j2{animation-delay:2.3s} .go .s3{animation-delay:2.7s}

  .icing{bottom:108px;width:248px;height:22px;background:var(--cream);border-radius:14px 14px 6px 6px}
  .go .icing{animation-delay:3.3s}
  .icing i{position:absolute;top:12px;width:14px;height:0;background:var(--cream);border-radius:0 0 8px 8px}
  .go .icing i{animation:drip 1.5s ease-out 4.1s forwards}
  .icing em{position:absolute;width:8px;height:3px;border-radius:2px;opacity:0}
  .go .icing em{animation:pop .45s ease-out calc(5s + var(--k) * .07s) forwards}

  /* หน้าเค้ก */
  .face{bottom:50px;width:130px;height:34px;opacity:0}
  .go .face{animation:pop .8s ease-out 6.1s both}
  .eye{position:absolute;top:4px;width:9px;height:12px;border-radius:50%;background:#5a3a42;transition:all .25s}
  .eye.l{left:30px} .eye.r{right:30px}
  .go .eye{animation:blink 4s ease-in-out 7.5s infinite}
  .blush{position:absolute;top:16px;width:16px;height:8px;border-radius:50%;background:rgba(255,120,150,.55)}
  .blush.l{left:14px} .blush.r{right:14px}
  .mouth{position:absolute;top:14px;left:50%;translate:-50% 0;width:14px;height:7px;
         border:3px solid #5a3a42;border-top:0;border-radius:0 0 12px 12px;box-sizing:border-box;transition:all .25s}
  .out .eye{height:7px;background:none;border-top:3px solid #5a3a42;border-radius:50% 50% 0 0;animation:none}
  .out .mouth{width:18px;height:11px;background:#e0607e;border-color:#5a3a42}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

  .candle{bottom:128px;width:11px;height:46px;border-radius:3px;
          background:repeating-linear-gradient(135deg,#fff 0 6px,#ff8fab 6px 10px)}
  .go .candle{animation-delay:6.6s}
  .flame{bottom:172px;width:14px;height:24px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
         background:radial-gradient(ellipse at 50% 70%,#fff8d6 0 20%,#ffd25e 45%,#ff9a3c 80%);
         transform-origin:50% 90%;opacity:0;transition:opacity .25s}
  .go .flame{animation:light .9s ease-out 7.6s both, flicker .14s ease-in-out 8.5s infinite alternate}
  .glow{bottom:134px;width:140px;height:140px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .4s;
        background:radial-gradient(circle,rgba(255,240,180,.7),rgba(255,240,180,0) 65%)}
  .go .glow{animation:light 1.4s ease-out 7.7s both, pulse 2.4s ease-in-out 9.1s infinite}
  .out .flame,.out .glow{opacity:0!important}

  .smoke{bottom:174px;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.8);opacity:0}
  .go .smoke{animation:none}
  .go .out .smoke{animation:smoke 2.2s ease-out forwards}
  .go .out .smoke:nth-of-type(2){animation-delay:.3s} .go .out .smoke:nth-of-type(3){animation-delay:.6s}

  @keyframes drop{from{transform:translateY(-320px);opacity:0}60%{transform:translateY(6px);opacity:1}
                  80%{transform:translateY(-3px)}to{transform:none;opacity:1}}
  @keyframes slide{from{transform:translateX(-120vw)}to{transform:none}}
  @keyframes drip{to{height:var(--h)}}
  @keyframes pop{from{opacity:0;scale:.3}70%{scale:1.2}to{opacity:1;scale:1}}
  @keyframes light{from{opacity:0;scale:.2}to{opacity:1;scale:1}}
  @keyframes flicker{from{transform:rotate(-3deg)}to{transform:rotate(3deg) scaleY(1.08)}}
  @keyframes pulse{50%{scale:1.12}}
  @keyframes smoke{0%{opacity:.8;transform:none}100%{opacity:0;transform:translate(var(--dx,6px),-70px) scale(3)}}

  /* ---------- ข้อความ ---------- */
  .words{position:relative;z-index:2;text-align:center;display:grid;gap:2px;opacity:0}
  .go .words{animation:fade 1.4s ease-out 8.6s both}
  h1{margin:0;font:italic 300 clamp(32px,8vw,46px)/1.1 Lato,Mali,sans-serif;letter-spacing:.01em}
  .name{font:italic 400 clamp(21px,5vw,27px)/1.4 Lato,Mali,sans-serif;color:var(--soft)}
  .hint{margin-top:12px;font:500 15px/1.4 Mali,sans-serif;color:var(--soft);opacity:0;min-height:34px}
  .go .hint{animation:fade 1.2s ease-out 10.5s both}
  .hint button{font:inherit;color:var(--ink);background:rgba(255,255,255,.6);border:0;border-radius:999px;padding:6px 16px;cursor:pointer}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  /* ---------- ซองจดหมาย (วาดด้วย CSS) ---------- */
  .hint{position:relative}
  .env-wrap{position:absolute;left:50%;top:4px;translate:-50% 0;width:max-content;
            display:grid;justify-items:center;gap:8px;animation:pop .6s ease-out both}
  .env{position:relative;width:112px;height:74px;padding:0;border:0;border-radius:6px;background:none;cursor:pointer;
       perspective:400px;filter:drop-shadow(0 6px 10px rgba(176,74,112,.28));animation:nudge 1.4s ease-in-out .8s infinite}
  .env.open{animation:none}
  .env > span{position:absolute;border-radius:6px}
  .env-back {inset:0;background:#ff9fb8}
  .env-paper{left:10px;right:10px;top:8px;height:58px;background:#fffaf5;z-index:1;border-radius:4px;
             transition:transform .6s ease-out .35s}
  .env-paper::before,.env-paper::after{content:"";position:absolute;left:12px;right:12px;height:3px;border-radius:2px;background:#ffd6e0}
  .env-paper::before{top:12px} .env-paper::after{top:20px;right:30px}
  .env-front{inset:0;z-index:2;background:#ffc4d3;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
  .env-flap {left:0;right:0;top:0;height:62%;z-index:3;background:#ffb0c4;border-radius:6px 6px 0 0;
             clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;
             transition:transform .5s ease-in-out, z-index 0s .25s}
  .env-seal {left:50%;top:50%;translate:-50% -50%;z-index:4;font-size:20px;line-height:1;transition:opacity .2s}
  .env.open .env-flap {transform:rotateX(180deg);z-index:0}
  .env.open .env-seal {opacity:0}
  .env.open .env-paper{transform:translateY(-34px)}
  .env-label{font:500 15px/1.4 Mali,sans-serif;color:var(--soft)}
  @keyframes nudge{0%,100%{transform:none}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg) translateY(-3px)}}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- การ์ดจดหมาย ---------- */
  #card{position:fixed;left:50%;bottom:16px;z-index:5;width:min(360px,calc(100% - 32px));box-sizing:border-box;
        translate:-50% 130%;transition:translate 1.1s cubic-bezier(.3,1.2,.5,1);
        background:#fffaf5;border-radius:20px;padding:30px 22px 16px;box-shadow:0 14px 40px rgba(176,74,112,.28);
        font:500 16px/1.7 Mali,sans-serif;color:var(--soft)}
  #card.show{translate:-50% 0}
  #card::before{content:"💌";position:absolute;top:-22px;left:50%;translate:-50% 0;font-size:34px}
  #msg{white-space:pre-line;min-height:10.2em;text-align:center;text-wrap:balance}   /* จองที่ให้ 6 บรรทัด การ์ดจะไม่ยืดตอนกำลังพิมพ์ */
  #msg::first-line{font-weight:700;color:var(--ink);font-size:1.1em}   /* บรรทัดแรก = หัวการ์ด */
  #sign{text-align:center;margin-top:6px;color:var(--ink);font-weight:700;opacity:0;transition:opacity 1.2s}
  #card .row{display:flex;justify-content:center;margin-top:10px}
  #card button{font:500 14px Mali,sans-serif;color:var(--ink);background:#ffe1e8;border:0;border-radius:999px;padding:6px 16px;cursor:pointer}

  #sound{position:fixed;top:54px;right:14px;z-index:6;width:38px;height:38px;border-radius:50%;border:0;
         background:rgba(255,255,255,.6);font-size:18px;cursor:pointer;display:none}
  .go #sound{display:block}
  /* ---------- ฉากคำอวยพรตอนเปิด ---------- */
  #intro{position:fixed;inset:0;z-index:8;overflow:hidden;cursor:pointer;
         background:radial-gradient(ellipse at 50% 45%,#fff3f6 0,var(--bg2) 85%);transition:opacity .9s}
  #intro.bye{opacity:0}
  #intro .big{position:absolute;z-index:2;left:50%;top:50%;translate:-50% -50%;width:90%;text-align:center;
              font:700 clamp(30px,8vw,54px)/1.25 Mali,sans-serif;color:var(--ink);text-shadow:0 2px 0 #fff,0 0 24px #fff}
  #intro .big.pop{animation:pop .6s ease-out both}
  #intro .skip{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;color:var(--soft);opacity:.6}
  .wish{position:absolute;translate:-50% -50%;padding:5px 12px;border-radius:999px;white-space:nowrap;
        font:500 clamp(13px,3.4vw,17px)/1.4 Mali,sans-serif;color:var(--soft);box-shadow:0 3px 10px rgba(176,74,112,.15);
        animation:pop .7s ease-out both, bob 3s ease-in-out .8s infinite alternate;
        transition:transform 1.2s cubic-bezier(.5,0,.8,.4),opacity 1.2s}
  @keyframes bob{from{margin-top:0}to{margin-top:-6px}}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
</style>

<div id="gift" role="button" tabindex="0" aria-label="เปิดของขวัญ">
  <div class="box">🎁</div><b id="giftTo">มีของขวัญมาส่งจ้า</b><small>แตะเพื่อเปิดนะ</small>
</div>
<div id="intro" hidden><div class="big" id="big"></div><div class="skip">แตะเพื่อไปที่เค้ก</div></div>
<div id="bunting"></div>
<button id="sound" aria-label="ปิดเสียง">🔊</button>
<canvas id="fx"></canvas>

<div class="scene">
  <div class="cake" id="cake" role="button" tabindex="0" aria-label="แตะเพื่อเป่าเทียน">
    <div class="plate"></div>
    <div class="sponge s1"></div><div class="jam j1"></div>
    <div class="sponge s2"></div><div class="jam j2"></div>
    <div class="sponge s3"></div>
    <div class="face"><span class="eye l"></span><span class="eye r"></span>
      <span class="blush l"></span><span class="blush r"></span><span class="mouth"></span></div>
    <div class="icing" id="icing">
      <i style="left:12px;--h:44px"></i><i style="left:38px;--h:30px;animation-delay:4.3s"></i>
      <i style="left:72px;--h:16px"></i><i style="left:104px;--h:20px;animation-delay:4.4s"></i>
      <i style="left:134px;--h:14px;animation-delay:4.2s"></i><i style="left:166px;--h:18px"></i>
      <i style="left:196px;--h:34px;animation-delay:4.35s"></i><i style="left:224px;--h:48px;animation-delay:4.2s"></i>
    </div>
    <div class="glow"></div>
    <div class="candle"></div>
    <div class="flame"></div>
    <span class="smoke"></span><span class="smoke" style="--dx:-8px"></span><span class="smoke" style="--dx:14px"></span>
  </div>
</div>

<div class="words">
  <h1 id="title">happy birthday!</h1>
  <div class="name" id="name">OilNoh</div>
  <div class="hint" id="hint">แตะเทียนเพื่อเป่านะ 🕯️</div>
</div>

<div id="card" aria-live="polite">
  <div id="msg"></div>
  <div id="sign">— จากเค้า 💗</div>
  <div class="row"><button id="again">จุดเทียนใหม่ 🕯️</button></div>
</div>

<script>
// ===== ปรับแต่งผ่านลิงก์ได้: ?name=ชื่อ&msg=บรรทัด1|บรรทัด2|... =====
const q = new URLSearchParams(location.search);
const NAME = q.get('name') || 'OilNoh';
const MSG = (q.get('msg') ||
  'สุขสันต์วันเกิดนะ|เค้าดีใจมากๆ ที่มีเธออยู่ในชีวิต|ขอบคุณที่เป็นความสุขให้กันเสมอ|ขอให้ปีนี้มีแต่เรื่องดีๆ เข้ามา|ไม่ว่าจะเจออะไร|ขอให้รู้ว่ามีเค้าคอยอยู่ข้างๆ เสมอนะ').split('|').join('\n');

document.getElementById('name').textContent = NAME;
document.getElementById('giftTo').textContent = `มีของขวัญมาส่งให้ ${NAME} จ้า`;
document.title = `${NAME}'s Birthday Cake`;
const $ = id => document.getElementById(id);
const cake = $('cake'), hint = $('hint'), card = $('card');

// ---------- ธงราว + โรยหน้า + ลูกโป่ง ----------
const FLAGS = ['#ff8fab', '#ffd25e', '#8fd3ff', '#b8e986', '#c9a7ff'];
const letters = [...'HAPPY BIRTHDAY'];
letters.forEach((ch, i) => {
  const f = document.createElement('div');
  f.className = 'flag' + (ch === ' ' ? ' gap' : '');
  f.textContent = ch;
  f.style.background = FLAGS[i % FLAGS.length];
  f.style.setProperty('--i', i);
  f.style.setProperty('--y', `${Math.sin(i / (letters.length - 1) * Math.PI) * 16}px`); // ห้อยเป็นโค้ง
  $('bunting').append(f);
});
const SPR = ['#ff5f8f', '#ffd25e', '#8fd3ff', '#b8e986', '#c9a7ff'];
for (let k = 0; k < 16; k++) {
  const e = document.createElement('em');
  e.style.cssText = `left:${10 + Math.random() * 222}px;top:${3 + Math.random() * 10}px;background:${SPR[k % 5]};` +
                    `rotate:${Math.random() * 180}deg;--k:${k}`;
  $('icing').append(e);
}
const BAL = ['#ffb3c7', '#ffe08a', '#b5e3ff', '#d6c2ff', '#c8f0b0', '#ffc9a8'];
for (let b = 0; b < 7; b++) {
  const el = document.createElement('div');
  el.className = 'balloon';
  el.style.cssText = `left:${5 + b * 13 + Math.random() * 6}%;background:${BAL[b % BAL.length]};` +
                     `--t:${17 + Math.random() * 8}s;--d:${0.5 + Math.random() * 7}s`;
  document.body.append(el);
}

// ---------- เพลง Happy Birthday (public domain) ด้วย Web Audio ----------
let actx, master, muted = false;
const N = {G4: 392, A4: 440, B4: 493.9, C5: 523.3, D5: 587.3, E5: 659.3, F5: 698.5, G5: 784};
const SONG = [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
              ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
              ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
              ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]];
function playSong() {
  if (!actx) return;
  let t = actx.currentTime + .1;
  const beat = .62;
  SONG.forEach(([n, d]) => {
    // เสียงกล่องดนตรี: sine + triangle เบาๆ ตัดหางเร็ว
    [['sine', 1, .22], ['triangle', 2, .05]].forEach(([type, mul, vol]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = N[n] * mul;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + d * beat + .35);
      o.connect(g).connect(master); o.start(t); o.stop(t + d * beat + .4);
    });
    t += d * beat;
  });
}
$('sound').onclick = () => {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 1;
  $('sound').textContent = muted ? '🔇' : '🔊';
  $('sound').setAttribute('aria-label', muted ? 'เปิดเสียง' : 'ปิดเสียง');
};

// ---------- ฉากคำอวยพร (~8 วิ) ก่อนเข้าเค้ก ----------
const BIG = ['วันนี้วันพิเศษ', 'ของคนพิเศษ', 'สุขสันต์วันเกิดนะ', `${NAME} 💗`];
const WISHES = [
  'ขอให้มีความสุขมากๆ 💖', 'สุขภาพแข็งแรง 💪', 'ยิ้มเยอะๆ นะ 😊', 'รวยๆ เฮงๆ 💰', 'สมหวังทุกอย่าง ✨',
  'ขอให้ปังๆ 🎉', 'คิดอะไรก็สมหวัง 🌈', 'ไม่เหนื่อยเกินไปนะ', 'หลับฝันดีทุกคืน 🌙', 'กินอะไรก็อร่อย 🍰',
  'โชคดีตลอดปี 🍀', 'มีแต่คนรัก 💕', 'งานราบรื่น 📈', 'เงินเข้าทุกวัน 💸', 'ได้เที่ยวเยอะๆ ✈️',

  'หายเหนื่อยไวๆ นะ', 'ไม่ป่วยไม่ไข้ 🩷', 'เก่งขึ้นทุกวัน ⭐', 'ขอให้ได้ทุกอย่างที่อยากได้ 🎁', 'อยู่กับเค้าไปนานๆ นะ',

  'Make a wish ✨', 'You deserve the world 🌍', 'Cheers to you 🥂', 'Shine bright ✨', 'Sweetest birthday 🍭',

const PILL = ['#fff', '#ffe1ea', '#fff4d6', '#e3f4ff', '#efe6ff', '#e8f8dc'];

function blip() {                               // เสียงติ๊งเบาๆ ตอนคำอวยพรโผล่
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = 'sine'; o.frequency.value = 1100 + Math.random() * 900;
  g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
  o.connect(g).connect(master); o.start(t); o.stop(t + .2);
}

function runIntro(done) {
  const intro = $('intro'), big = $('big'), timers = [];
  intro.hidden = false;
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  let finished = false;
  const finish = () => {
    if (finished) return; finished = true;
    timers.forEach(clearTimeout);
    // ทุกคำพุ่งออกจากกลางจอแล้วจาง
    intro.querySelectorAll('.wish').forEach(w => {
      const dx = parseFloat(w.style.left) - innerWidth / 2, dy = parseFloat(w.style.top) - innerHeight / 2;
      w.style.transform = `translate(${dx * 1.6}px, ${dy * 1.6}px) scale(.6)`;
      w.style.opacity = 0;
    });
    setTimeout(() => intro.classList.add('bye'), 900);
    setTimeout(() => { intro.remove(); done(); }, 1800);
  };
  intro.addEventListener('click', finish);

  BIG.forEach((line, i) => later(i * 2500, () => {
    big.textContent = line; big.classList.remove('pop'); void big.offsetWidth; big.classList.add('pop');
  }));
  const placed = [];
  // จอแคบ (มือถือ) ใช้ 27 คำ ไม่งั้นทับกันแน่น · กระจายให้จบใน~9 วิเท่าเดิม
  const list = innerWidth < 500 ? WISHES.filter((_, i) => i % 5 !== 1 && i % 5 !== 3) : WISHES;
  const gap = 9000 / list.length;
  list.forEach((text, i) => later(400 + i * gap, () => {
    const w = document.createElement('div');
    w.className = 'wish'; w.textContent = text;
    w.style.cssText = `background:${PILL[i % PILL.length]};rotate:${(Math.random() - .5) * 12}deg`;
    intro.append(w);
    // วัดขนาดจริงก่อน แล้วสุ่ม 14 ตำแหน่ง เลือกจุดที่ห่างจากคำอื่นมากที่สุด (best-candidate)
    const W = innerWidth, H = innerHeight, ww = w.offsetWidth, wh = w.offsetHeight;
    const band = Math.max(big.offsetHeight, 70) / 2 + wh / 2 + 10;   // แถบกลางจอสำหรับข้อความใหญ่
    let best = [W / 2, wh], bestD = -1;
    for (let k = 0; k < 14; k++) {
      const x = ww / 2 + 8 + Math.random() * Math.max(0, W - ww - 16);
      const y = wh / 2 + 8 + Math.random() * Math.max(0, H - wh - 44);
      if (Math.abs(y - H / 2) < band) continue;
      const d = placed.length ? Math.min(...placed.map(([px, py]) => Math.hypot((px - x) / W, (py - y) / H))) : 1;
      if (d > bestD) { bestD = d; best = [x, y]; }
    }
    placed.push(best);
    w.style.left = best[0] + 'px'; w.style.top = best[1] + 'px';
    blip();
  }));
  later(10300, finish);
}

// ---------- เปิดของขวัญ ----------
let goAt = Infinity;
function startCake() {
  document.body.classList.add('go');
  goAt = performance.now();
  setTimeout(playSong, 7700);          // เริ่มร้องตอนเทียนติด (ตรงกับ .flame delay)
}
function open() {
  $('gift').remove();
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.connect(actx.destination);
  } catch {}
  runIntro(startCake);
}
$('gift').addEventListener('click', open);
$('gift').addEventListener('keydown', e => (e.key === 'Enter' || e.key === ' ') && open());

// ---------- เป่าเทียน ----------
function blow() {
  if (performance.now() - goAt < 8500 || cake.classList.contains('out')) return;
  cake.classList.add('out');
  $('title').textContent = 'make a wish ✨';
  hint.textContent = '';
  confetti();
  // ให้ดูคอนเฟตตีก่อน แล้วค่อยโผล่ปุ่มจดหมายให้แตะเปิดเอง
  letterTimer = setTimeout(() => {
    hint.innerHTML =
      '<div class="env-wrap">' +
        '<button id="openLetter" class="env" aria-label="เปิดจดหมาย">' +
          '<span class="env-back"></span><span class="env-paper"></span>' +
          '<span class="env-front"></span><span class="env-flap"></span><span class="env-seal">💗</span>' +
        '</button>' +
        '<div class="env-label">มีจดหมายถึงเธอ แตะเพื่อเปิดนะ</div>' +
      '</div>';
    $('openLetter').onclick = e => {
      e.stopPropagation();
      const env = e.currentTarget;
      if (env.classList.contains('open')) return;
      env.classList.add('open');                       // ฝาเปิด → กระดาษเลื่อนออก
      letterTimer = setTimeout(() => {
        hint.textContent = '';
        liftForCard(); card.classList.add('show'); typeMsg();
      }, 1100);
    };
  }, 2200);
}
let letterTimer;
cake.addEventListener('click', blow);
cake.addEventListener('keydown', e => (e.key === 'Enter' || e.key === ' ') && blow());

function liftForCard() {
  const cardTop = innerHeight - 16 - card.offsetHeight;
  const nameBottom = $('name').getBoundingClientRect().bottom;
  const room = cake.getBoundingClientRect().top - 60;        // อย่าให้เค้กชนธงราว
  const d = Math.min(Math.max(0, nameBottom - cardTop + 12), Math.max(0, room));
  document.body.style.setProperty('--lift', d + 'px');
}

$('again').onclick = () => {
  clearTimeout(letterTimer);
  document.body.style.setProperty('--lift', '0px');
  card.classList.remove('show');
  cake.classList.remove('out');
  $('title').textContent = 'happy birthday!';
  hint.textContent = 'แตะเทียนเพื่อเป่านะ 🕯️';
  playSong();
};

// พิมพ์ทีละ grapheme ไม่ให้สระ/วรรณยุกต์ไทยลอยเดี่ยว
let typing;
function typeMsg() {
  clearTimeout(typing);
  const g = window.Intl && Intl.Segmenter
    ? [...new Intl.Segmenter('th', {granularity: 'grapheme'}).segment(MSG)].map(s => s.segment)
    : [...MSG];
  let i = 0; $('msg').textContent = ''; $('sign').style.opacity = 0;
  const step = () => {
    const ch = g[i++] || '';
    $('msg').textContent += ch;
    if (i >= g.length) { typing = setTimeout(() => $('sign').style.opacity = 1, 500); return; }
    typing = setTimeout(step, ch === '\n' ? 650 : 85);   // เว้นจังหวะตอนขึ้นบรรทัดใหม่ เหมือนคนเขียน
  };
  typing = setTimeout(step, 600);
}

// ---------- คอนเฟตตี ----------
const cv = $('fx'), ctx = cv.getContext('2d');
let bits = [], running = false;
function confetti() {
  const d = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  const r = cake.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.top;
  const colors = ['#fffaf2', '#ff5f8f', '#ffd25e', '#8fd3ff', '#c9a7ff', '#b8e986'];
  for (let i = 0; i < 160; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, v = 5 + Math.random() * 8;
    bits.push({x: x0, y: y0, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: Math.random() * 6,
               vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4,
               c: colors[i % colors.length], heart: i % 7 === 0, life: 1});
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  bits = bits.filter(b => b.life > 0 && b.y < innerHeight + 20);
  bits.forEach(b => {
    b.vy += .16; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.life -= .0035;
    ctx.save(); ctx.globalAlpha = Math.min(1, b.life * 2); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
    if (b.heart) { ctx.font = '14px sans-serif'; ctx.fillText('💗', -7, 5); }
    else { ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.rot * 2)) + 1); }
    ctx.restore();
  });
  if (bits.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}
